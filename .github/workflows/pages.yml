# 静的サイト(ビルド不要)を GitHub Pages へ公開するワークフロー
name: Deploy to GitHub Pages

# 注意: github-pages 環境は「デフォルトブランチからのデプロイ」のみ許可されます。
# デフォルトブランチを変更した場合は、下の branches も合わせて書き換えてください。
on:
  push:
    branches:
      - claude/precision-sheet-metal-learning-0ohqhc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理は同時に1つだけ実行する(実行中のものはキャンセルしない)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定を取得(未設定なら有効化)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: サイト一式をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
